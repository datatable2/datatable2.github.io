[project]
site_name = "DataTable2 Documentation"
title = "DataTable2 Docs"
description = "DataTable2 Documentation"
authors = ["pablissimo77"]
page_url = "https://datatable2.github.io"
#extra_javascript = ["javascripts/feedback.js", "javascripts/feedback_discord.js"]
nav = [
    { "Home" = "index.md" },
    { "Основні поняття" = "concepts.md" },
    { "Інтерфейс 🚧" = "interface.md" },
    { "Головне меню 🚧" = "main_menu.md" },
    { "Вікно ознак 🚧" = ["signs/index.md", { "Вигляд 🚧" = "signs/signs.md" }] },
    { "Вкладки" = [
        { "Ознаки 🚧" = ["tab_signs/index.md"] },
        { "Налаштування таблиць 🚧" = [
            "tab_options/index.md",
            { "Альтернативи в колонках та рядках 🚧" = [
                "tab_options/row_column/index.md",
                { "Опції виводу 🚧" = "tab_options/row_column/show_options.md" },
                { "Сортування 🚧" = "tab_options/row_column/sorting.md" }]
            },
            { "Значущість різниць 🚧" = [
                "tab_options/significance_of_differences/index.md",
                { "Порівняння 🚧" = "tab_options/significance_of_differences/comparing.md" },
                { "Колонка виводу 🚧" = "tab_options/significance_of_differences/output_column.md" },
                { "Символи 🚧" = "tab_options/significance_of_differences/symbols.md" }]
            },
            { "TopBox 🚧" = ["tab_options/topbox/index.md"] },
        ] },
        { "Ваги, Спліти, Фільтри 🚧" = [
            "tab_weight_split_filter/index.md",
            { "Ваги 🚧" = "tab_weight_split_filter/weight.md" },
            { "Спліт 🚧" = "tab_weight_split_filter/split.md" },
            { "Фільтр 🚧" = "tab_weight_split_filter/filter.md" },
        ]
        },
        { "Трансформація" = [
            "tab_transformation/index.md",
            { "Номінальні/Мультиваріантні" = "tab_transformation/make_nj.md" },
            { "Метричні" = "tab_transformation/make_m.md" },
            { "Команда loop_sign" = "tab_transformation/loop_sign.md" },
        ]
        },
        { "Стилі таблиць 🚧" = [
            "tab_styles/index.md",
        ]
        },
        { "Вивід 🚧" = [
            "tab_output/index.md",
        ]
        },
    ] },
    { "Screenshots" = "screenshots.md" },
    { "Логування 🚧" = "logging.md" },
    { "Resources" = [
        { "Download" = "download.md" },
        { "ToDo" = "todo.md" },
        { "Changelog" = "changelog.md" },
        { "Eula" = "eula.md" },
        { "Credits" = "credits.md" }
    ]
    },
    { "Feedback 🚧" = "feedback.md" },
]

[project.extra.analytics]
provider = "google"
property = "G-MRD6PRZJWH"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.zensical.extensions.glightbox]
auto = true
auto_caption = true
[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.toc]
permalink = true

[project.extra.consent]
title = "Cookie consent"
description = """
    We use cookies to recognize your repeated visits and preferences, as well
    as to measure the effectiveness of our documentation and whether users
    find what they're searching for. With your consent, you're helping us to
    make our documentation better.
"""

[project.theme]
name = "material"
logo = "assets/DataTable2.png"
favicon = "assets/DataTable2.ico"
language = "uk"
features = [
    "toc.follow",
    "navigation.top",
    #    "navigation.tabs",
    #    "navigation.tabs.sticky",
    #    "navigation.sections",
    #    "navigation.expand",
    "navigation.indexes",
    "content.code.copy",
    "content.code.select",
    "content.code.annotate"
]


[build]
static_dir = "docs/assets"


