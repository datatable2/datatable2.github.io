name: Documentation
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Оновлено для підтримки Node.js 24
      - uses: actions/checkout@v5

      # Оновлено для підтримки Node.js 24 (це також має прибрати попередження про punycode)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install zensical
        run: pip install zensical==0.0.45

      - name: Inject Discord webhook secrets
        run: |
          sed -i "s|__DISCORD_WEBHOOK_ID__|${{ secrets.DISCORD_WEBHOOK_ID }}|g" docs/feedback.md
          sed -i "s|__DISCORD_WEBHOOK_TOKEN__|${{ secrets.DISCORD_WEBHOOK_TOKEN }}|g" docs/feedback.md

      - name: Build documentation
        run: zensical build --clean

      # Оновлено для підтримки Node.js 24
      - uses: actions/configure-pages@v6

      # Залишається v5, оскільки тут попереджень не було, але можна перевірити наявність новішої
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Оновлено для підтримки Node.js 24
      - uses: actions/deploy-pages@v5
        id: deployment